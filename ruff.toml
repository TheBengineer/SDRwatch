target-version = "py312"
line-length = 100
exclude = [".virtualenvs", ".venv", "__pycache__", "node_modules", ".git"]

[format]
quote-style = "double"

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "T20"]
ignore = ["E501", "N802", "N803", "N806"]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
