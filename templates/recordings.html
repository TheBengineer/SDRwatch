{% extends "base.html" %}
{% block content %}
<div class="space-y-4">
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-3">
      <h1 class="text-2xl font-bold">Recordings</h1>
      <span id="signal-badge" class="chip text-xs bg-sky-600/60 text-sky-100" style="display:none"></span>
    </div>
    <span class="text-sm text-slate-400" id="rec-count">0 recordings</span>
  </div>

  <!-- Filter toolbar -->
  <div class="subgrid">
    <div class="field">
      <label for="baseline-filter">Baseline</label>
      <select id="baseline-filter" class="input">
        <option value="">All baselines</option>
      </select>
    </div>
    <div class="field">
      <label for="mod-filter">Modulation</label>
      <select id="mod-filter" class="input">
        <option value="">All modulations</option>
        <option value="fm">FM</option>
        <option value="am">AM</option>
        <option value="cw">CW</option>
        <option value="usb">USB</option>
        <option value="lsb">LSB</option>
        <option value="digital">Digital</option>
        <option value="unknown">Unknown</option>
      </select>
    </div>
    <div class="field">
      <label for="status-filter">Status</label>
      <select id="status-filter" class="input">
        <option value="">All statuses</option>
        <option value="queued">Queued</option>
        <option value="raw">Raw</option>
        <option value="compressed">Compressed</option>
        <option value="compression_failed">Failed</option>
      </select>
    </div>
    <div class="field">
      <label for="f-min">Min MHz</label>
      <input id="f-min" class="input" type="number" step="0.1" placeholder="e.g. 88" onchange="loadRecordings()">
    </div>
    <div class="field">
      <label for="f-max">Max MHz</label>
      <input id="f-max" class="input" type="number" step="0.1" placeholder="e.g. 108" onchange="loadRecordings()">
    </div>
    <div class="flex items-end gap-2">
      <button class="btn text-sm" id="refresh-btn">↻ Refresh</button>
      <button class="btn red text-sm" id="bulk-delete-btn" style="display:none">✕ Delete Selected</button>
    </div>
  </div>

  <!-- Recordings table -->
  <div class="card overflow-x-auto">
    <table class="table">
      <thead>
        <tr class="text-xs uppercase text-slate-400">
          <th class="th" style="width:32px"><input type="checkbox" id="select-all" title="Select all"></th>
          <th class="th">ID</th>
          <th class="th">Freq (MHz)</th>
          <th class="th">Modulation</th>
          <th class="th">Duration</th>
          <th class="th">Raw</th>
          <th class="th">OGG</th>
          <th class="th">Status</th>
          <th class="th">Created</th>
          <th class="th">Actions</th>
        </tr>
      </thead>
      <tbody id="recordings-body">
        <tr><td colspan="10" class="td text-center text-slate-500 py-8">Loading recordings...</td></tr>
      </tbody>
    </table>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const TOKEN = localStorage.getItem("SDRWATCH_TOKEN") || "";
function auth(hdrs={}){ if(TOKEN) hdrs["Authorization"]="Bearer "+TOKEN; hdrs["Content-Type"]="application/json"; return hdrs; }

async function loadBaselines(){
  try{
    const r = await fetch("/api/baselines", { headers: auth({}) });
    if(!r.ok) return;
    const data = await r.json();
    const list = data.baselines || [];
    const sel = document.getElementById("baseline-filter");
    sel.innerHTML = '<option value="">All baselines</option>';
    list.forEach(b => {
      const opt = document.createElement("option");
      opt.value = b.id;
      opt.textContent = `#${b.id} · ${b.name}`;
      sel.appendChild(opt);
    });
  }catch(e){ /* baselines unavailable */ }
}

async function loadRecordings(){
  const params = new URLSearchParams();
  const bl = document.getElementById("baseline-filter")?.value;
  const mod = document.getElementById("mod-filter")?.value;
  const st = document.getElementById("status-filter")?.value;
  if(bl) params.set("baseline_id", bl);
  if(mod) params.set("modulation", mod);
  if(st) params.set("status", st);
  const fmin = document.getElementById("f-min")?.value;
  const fmax = document.getElementById("f-max")?.value;
  if(fmin) params.set("f_min_mhz", fmin);
  if(fmax) params.set("f_max_mhz", fmax);
  if(filterDetectionId) params.set("detection_id", filterDetectionId);
  try{
    const r = await fetch("/api/recordings?" + params.toString(), { headers: auth({}) });
    if(!r.ok) throw new Error("fetch failed");
    const data = await r.json();
    const list = data.recordings || [];
    const queuedCount = list.filter(r => r.status === "queued").length;
    document.getElementById("rec-count").textContent = list.length + " recordings" + (queuedCount ? " (" + queuedCount + " queued)" : "");
    const badge = document.getElementById("signal-badge");
    if(badge){
      if(filterDetectionId){
        badge.style.display = "inline";
        badge.innerHTML = `Signal #${filterDetectionId} <a href="/signal/${filterDetectionId}" class="text-sky-200 hover:text-white ml-1">→</a>`;
      } else {
        badge.style.display = "none";
      }
    }
    const prevExpanded = expandedId;           // preserve expanded row across re-render
    const tbody = document.getElementById("recordings-body");
    if(list.length === 0){
      tbody.innerHTML = '<tr><td colspan="10" class="td text-center text-slate-500 py-8">No recordings yet. Run a scan with --capture-iq to create recordings.</td></tr>';
      expandedId = null;
      return;
    }
    tbody.innerHTML = list.map(rec => {
      const modBadge = rec.modulation ? `<span class="chip text-xs">${rec.modulation.toUpperCase()}</span>` : '<span class="chip text-xs text-slate-500">—</span>';
      const statusColor = rec.status === "compressed" ? "text-green-400" : rec.status === "queued" ? "text-amber-400" : rec.status === "compression_failed" ? "text-red-400" : "text-slate-400";
      const hasOgg = rec.ogg_exists || (rec.ogg_path && rec.status === "compressed");
      const checked = selected.has(rec.id);
      return `<tr class="cursor-pointer hover:bg-slate-800/40 ${checked ? 'bg-sky-900/20' : ''}" onclick="toggleExpand(${rec.id})">
        <td class="td" style="width:32px" onclick="event.stopPropagation()"><input type="checkbox" class="rec-checkbox" value="${rec.id}" ${checked ? 'checked' : ''} onchange="updateBulkDelete()"></td>
        <td class="td font-mono text-xs">${rec.id}</td>
        <td class="td font-mono">${rec.f_mhz ? rec.f_mhz.toFixed(4) : '—'}</td>
        <td class="td">${modBadge}</td>
        <td class="td text-xs">${rec.duration_ms ? (rec.duration_ms/1000).toFixed(1)+'s' : '—'}</td>
        <td class="td text-xs">${rec.raw_size_display || '—'}</td>
        <td class="td text-xs">${rec.ogg_size_display || '—'}</td>
        <td class="td text-xs ${statusColor}">${rec.status || '—'}</td>
        <td class="td text-xs text-slate-400">${rec.created_utc ? rec.created_utc.slice(0,19).replace('T',' ') : '—'}</td>
        <td class="td">
          <div class="flex flex-wrap gap-1 items-center" onclick="event.stopPropagation()">
            <button class="chip text-xs hover:bg-sky-600/40 cursor-pointer" onclick="downloadRaw(${rec.id})">⬇ Raw</button>
            <button class="chip text-xs hover:bg-red-600/40 cursor-pointer" onclick="deleteRec(${rec.id})">✕</button>
          </div>
        </td>
      </tr>
      <tr id="expand-${rec.id}" class="expand-row" style="display:none">
        <td colspan="10" class="td" style="padding:0">
          <div class="bg-slate-900/60 rounded-b-2xl p-4 space-y-3 border-t border-slate-700/40">
            <!-- Waveform audio player -->
            <div>
              <div class="text-xs text-slate-400 mb-1 flex items-center gap-2">
                <span id="playlabel-${rec.id}" class="cursor-pointer hover:text-sky-400" onclick="togglePlay(${rec.id})">▶ Click waveform to play</span>
                <span id="time-${rec.id}" class="text-slate-500">0:00 / ${rec.duration_ms ? formatTime(rec.duration_ms/1000) : '--:--'}</span>
                <span id="modlabel-${rec.id}" class="chip text-xs bg-sky-600/60 text-sky-100" style="display:none">FM</span>
              </div>
              <canvas id="plot-${rec.id}" height="100" style="width:100%;height:100px;background:#0b1220;border-radius:0.5rem;cursor:pointer"></canvas>
            </div>
            <!-- Audio element (always present, source set dynamically) -->
            <audio id="audio-${rec.id}" controls preload="none" style="width:100%;height:40px"></audio>
            <!-- Modulation buttons -->
            <div class="flex flex-wrap items-center gap-2 text-xs">
              <span class="text-slate-400 mr-1">Demod:</span>
              ${['wbfm','fm','am','cw','lsb','usb'].map(m =>
                `<button class="chip cursor-pointer hover:bg-sky-600/40 mod-btn-${rec.id} ${rec.modulation === m ? 'bg-sky-600/60 text-sky-100' : ''}" data-mod="${m}" onclick="event.stopPropagation();playModulation(${rec.id},'${m}')">${m.toUpperCase()}</button>`
              ).join('')}
              <span class="text-slate-500 ml-2">${rec.duration_ms ? (rec.duration_ms/1000).toFixed(1)+'s' : ''} ${rec.sample_rate_hz ? '@ '+(rec.sample_rate_hz/1e6).toFixed(1)+' MS/s' : ''}</span>
              <button class="chip text-xs hover:bg-green-600/40 cursor-pointer" onclick="event.stopPropagation();saveModulation(${rec.id})">💾 Save mod</button>
              <button class="chip text-xs hover:bg-sky-600/40 cursor-pointer" onclick="event.stopPropagation();downloadRaw(${rec.id})" style="margin-left:auto">⬇ Raw</button>
            </div>
            <div class="flex flex-wrap items-center gap-2 text-xs" style="margin-top:4px">
              <span class="text-slate-400">Classification:</span>
              <select id="modselect-${rec.id}" class="input text-xs py-0.5" style="max-width:120px" onchange="event.stopPropagation()">
                <option value="">—</option>
                <option value="friendly" ${rec.classification === 'friendly' ? 'selected' : ''}>Friendly</option>
                <option value="ambient" ${rec.classification === 'ambient' ? 'selected' : ''}>Ambient</option>
                <option value="hostile" ${rec.classification === 'hostile' ? 'selected' : ''}>Hostile</option>
                <option value="unknown" ${rec.classification === 'unknown' ? 'selected' : ''}>Unknown</option>
              </select>
            </div>
          </div>
        </td>
      </tr>`;
    }).join("");
    // Re-expand the previously expanded row after re-render
    const reExpand = prevExpanded && document.getElementById("expand-"+prevExpanded);
    if(reExpand){
      reExpand.style.display = "table-row";
      const canvas = document.getElementById("plot-"+prevExpanded);
      if(canvas && !canvas._amplitudeData && !canvas.dataset.loaded){
        canvas.dataset.loaded = "1";
        fetch("/api/recordings/"+prevExpanded+"/amplitude", { headers: auth({}) })
          .then(r => r.arrayBuffer())
          .then(buf => {
            const floats = new Float32Array(buf);
            const arr = Array.from(floats);
            canvas._amplitudeData = arr;
            drawAmplitude(canvas, arr, 0);
          }).catch(() => {});
      }
    }
  }catch(e){
    document.getElementById("recordings-body").innerHTML = '<tr><td colspan="9" class="td text-center text-red-400 py-8">Failed to load recordings</td></tr>';
  }
}

const selected = new Set();
const urlParams = new URLSearchParams(window.location.search);
const filterDetectionId = urlParams.get("detection_id");

function updateBulkDelete(){
  const boxes = document.querySelectorAll(".rec-checkbox");
  selected.clear();
  boxes.forEach(cb => { if(cb.checked) selected.add(parseInt(cb.value)); });
  const btn = document.getElementById("bulk-delete-btn");
  if(!btn) return;
  btn.style.display = selected.size > 0 ? "inline-flex" : "none";
  btn.textContent = "✕ Delete "+selected.size;
}

document.getElementById("select-all")?.addEventListener("change", function(){
  document.querySelectorAll(".rec-checkbox").forEach(cb => { cb.checked = this.checked; });
  updateBulkDelete();
});

document.getElementById("bulk-delete-btn")?.addEventListener("click", async function(){
  if(selected.size === 0) return;
  if(!confirm("Delete "+selected.size+" recording(s)?")) return;
  try{
    const r = await fetch("/api/recordings/bulk-delete", {
      method:"POST",
      headers: {'Content-Type':'application/json', ...(TOKEN ? {"Authorization":"Bearer "+TOKEN} : {})},
      body: JSON.stringify({ids: Array.from(selected)})
    });
    if(!r.ok){ alert("Bulk delete failed"); return; }
    selected.clear();
    loadRecordings();
  }catch(e){ alert("Bulk delete error"); }
});

function downloadRaw(id){ window.location.href = "/api/recordings/"+id+"/download/raw"; }

// Save modulation and classification for a recording
async function saveModulation(id){
  const modBtns = document.querySelectorAll(`.mod-btn-${id}`);
  let mod = "";
  modBtns.forEach(b => {
    if(b.classList.contains("bg-sky-600")) mod = b.dataset.mod || "";
  });
  const cls = document.getElementById("modselect-"+id)?.value || "";
  const body = {modulation: mod || null};
  if(cls) body.classification = cls;
  try{
    const r = await fetch("/api/recordings/"+id, {
      method:"PATCH",
      headers: {'Content-Type':'application/json', ...(TOKEN ? {"Authorization":"Bearer "+TOKEN} : {})},
      body: JSON.stringify(body)
    });
    const status = document.getElementById("recording-status");
    if(r.ok){
      // Highlight the saved modulation button
      modBtns.forEach(b => b.classList.remove("bg-sky-600/60", "text-sky-100"));
      modBtns.forEach(b => { if(b.dataset.mod === mod) b.classList.add("bg-sky-600/60", "text-sky-100"); });
      loadRecordings();
    } else {
      alert("Save failed");
    }
  }catch(e){ alert("Save error"); }
}

// Track active modulation button on click
document.addEventListener("click", function(e){
  const btn = e.target.closest("[data-mod]");
  if(!btn) return;
  const id = btn.closest("[id^='expand-']")?.id?.replace("expand-","");
  if(!id) return;
  const parent = btn.closest(".flex-wrap");
  if(!parent) return;
  parent.querySelectorAll("[data-mod]").forEach(b => {
    b.classList.remove("bg-sky-600/60", "text-sky-100");
  });
  btn.classList.add("bg-sky-600/60", "text-sky-100");
});

// Demodulate and play: POST modulation, receive OGG blob, auto-play
async function playModulation(id, mod){
  const audio = document.getElementById("audio-"+id);
  const label = document.getElementById("modlabel-"+id);
  const playlabel = document.getElementById("playlabel-"+id);
  if(!audio) return;
  try{
    const r = await fetch("/api/recordings/"+id+"/demod", {
      method:"POST",
      headers: {'Content-Type':'application/json', ...(TOKEN ? {"Authorization":"Bearer "+TOKEN} : {})},
      body: JSON.stringify({modulation: mod})
    });
    if(!r.ok){ if(playlabel) playlabel.textContent = "❌ Demod failed"; return; }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    audio.src = url;
    if(label){ label.textContent = mod.toUpperCase(); label.style.display = "inline"; }
    if(playlabel) playlabel.textContent = "⏸ "+mod.toUpperCase();

    // Hook timeupdate for playhead sync
    audio.onplay = null; audio.ontimeupdate = null; audio.onpause = null; audio.onended = null;
    audio.addEventListener("play", function handler(){
      const lid = document.getElementById("playlabel-"+id);
      if(lid) lid.textContent = "⏸ Playing";
    }, {once: true});
    audio.addEventListener("timeupdate", function handler(){
      updatePlayhead(id);
    });
    audio.addEventListener("ended", function(){
      const lid = document.getElementById("playlabel-"+id);
      if(lid) lid.textContent = "▶ Click to replay";
      updatePlayhead(id);
    });

    await audio.play();
  }catch(e){
    if(playlabel) playlabel.textContent = "❌ Error";
  }
}

async function deleteRec(id){
  if(!confirm("Delete recording #"+id+"?")) return;
  try{
    await fetch("/api/recordings/"+id, { method:"DELETE", headers: auth({}) });
    loadRecordings();
  }catch(e){ alert("Delete failed"); }
}

let expandedId = null;
async function toggleExpand(id){
  const row = document.getElementById("expand-"+id);
  if(!row) return;
  if(expandedId === id){
    row.style.display = "none";
    expandedId = null;
    return;
  }
  // Collapse previous
  if(expandedId){
    const prev = document.getElementById("expand-"+expandedId);
    if(prev) prev.style.display = "none";
  }
  row.style.display = "table-row";
  expandedId = id;
    // Load amplitude if canvas exists and empty
  const canvas = document.getElementById("plot-"+id);
  if(canvas && !canvas.dataset.loaded){
    canvas.dataset.loaded = "1";
    try{
      const r = await fetch("/api/recordings/"+id+"/amplitude", { headers: auth({}) });
      if(!r.ok) return;
      const buf = await r.arrayBuffer();
      const floats = new Float32Array(buf);
      const arr = Array.from(floats);
      canvas._amplitudeData = arr;
      drawAmplitude(canvas, arr, 0);
    }catch(e){ /* amplitude unavailable */ }
  }

  // Auto-play FM modulation on expand
  const audio = document.getElementById("audio-"+id);
  if(audio && !audio.dataset.fmTried){
    audio.dataset.fmTried = "1";
    playModulation(id, "fm");
  }
}

function formatTime(secs){
  if(!secs || secs < 0) return "0:00";
  const m = Math.floor(secs / 60);
  const s = Math.floor(secs % 60);
  return m+":"+(s<10?"0":"")+s;
}

function drawAmplitude(canvas, data, playheadPos){
  if(!canvas || !data || data.length < 2) return;
  const ctx = canvas.getContext("2d");
  const w = canvas.parentElement.clientWidth || 800;
  const h = 100;
  canvas.width = w * (window.devicePixelRatio || 1);
  canvas.height = h * (window.devicePixelRatio || 1);
  canvas.style.width = w+"px";
  canvas.style.height = h+"px";
  ctx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);
  ctx.clearRect(0, 0, w, h);

  const pad = 4;
  const plotW = w - pad * 2;
  const plotH = h - pad * 2;

  // Fill area
  ctx.beginPath();
  ctx.moveTo(pad, pad + plotH);
  for(let i=0; i<data.length; i++){
    const x = pad + (i / (data.length-1)) * plotW;
    const y = pad + plotH - (data[i] * plotH);
    ctx.lineTo(x, y);
  }
  ctx.lineTo(pad + plotW, pad + plotH);
  ctx.closePath();
  ctx.fillStyle = "rgba(14,165,233,0.15)";
  ctx.fill();

  // Draw line
  ctx.beginPath();
  for(let i=0; i<data.length; i++){
    const x = pad + (i / (data.length-1)) * plotW;
    const y = pad + plotH - (data[i] * plotH);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.strokeStyle = "#0ea5e9";
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Playhead
  if(playheadPos !== undefined && playheadPos >= 0){
    const phx = pad + playheadPos * plotW;
    ctx.beginPath();
    ctx.moveTo(phx, pad);
    ctx.lineTo(phx, pad + plotH);
    ctx.strokeStyle = "#fbbf24";
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

// Click-to-seek: attach click handler to canvases
document.addEventListener("click", function(e){
  const canvas = e.target.closest("canvas[id^='plot-']");
  if(!canvas) return;
  const id = canvas.id.replace("plot-","");
  const audio = document.getElementById("audio-"+id);
  if(!audio || !audio.duration) return;
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width;
  const dur = audio.duration;
  if(dur > 0){
    audio.currentTime = x * dur;
    audio.play();
    updatePlayhead(id);
  }
});

function togglePlay(id){
  const audio = document.getElementById("audio-"+id);
  if(!audio) return;
  const label = document.getElementById("playlabel-"+id);
  if(audio.paused){
    audio.play();
    if(label) label.textContent = "⏸ Playing";
  } else {
    audio.pause();
    if(label) label.textContent = "▶ Paused";
  }
}

function updatePlayhead(id){
  const audio = document.getElementById("audio-"+id);
  const canvas = document.getElementById("plot-"+id);
  const label = document.getElementById("playlabel-"+id);
  const timeLabel = document.getElementById("time-"+id);
  if(!audio || !canvas) return;

  const dur = audio.duration || 0;
  const ct = audio.currentTime || 0;
  if(timeLabel) timeLabel.textContent = formatTime(ct)+" / "+formatTime(dur);
  if(label) label.textContent = audio.paused ? "▶ Paused" : "⏸ Playing";

  // Redraw with playhead
  const data = canvas._amplitudeData;
  if(data) drawAmplitude(canvas, data, dur > 0 ? ct / dur : 0);
}



document.getElementById("refresh-btn")?.addEventListener("click", loadRecordings);
document.getElementById("baseline-filter")?.addEventListener("change", loadRecordings);
document.getElementById("mod-filter")?.addEventListener("change", loadRecordings);
document.getElementById("status-filter")?.addEventListener("change", loadRecordings);
loadBaselines();
loadRecordings();
setInterval(() => {
  // Don't re-render while a recording is expanded — would destroy audio element
  if(!expandedId) loadRecordings();
}, 5000);
</script>

<script>
(function(){
  const params = new URLSearchParams(window.location.search);
  if (!params.has("review")) return;

  // Hide existing table/filter UI
  document.querySelectorAll(".subgrid, .card.overflow-x-auto, #bulk-delete-btn").forEach(el => {
    if(el) el.style.display = "none";
  });

  const reviewContainer = document.createElement("div");
  reviewContainer.id = "review-container";
  reviewContainer.className = "space-y-4";
  document.querySelector(".space-y-4")?.prepend(reviewContainer);

  let recordings = [];
  let currentIdx = 0;
  let autoplay = false;

  async function loadReview(){
    try{
      const r = await fetch("/api/recordings", { headers: auth({}) });
      const data = await r.json();
      const all = (data.recordings || []).filter(r => r.detection_id && r.detection_id !== null);
      // Group by detection_id, keep latest
      const grouped = new Map();
      all.forEach(rec => {
        const key = rec.detection_id;
        const existing = grouped.get(key);
        if (!existing || (rec.created_utc || "") > (existing.created_utc || "")) {
          grouped.set(key, rec);
        }
      });
      recordings = Array.from(grouped.values());
      currentIdx = 0;
      renderReview();
    }catch(e){
      reviewContainer.innerHTML = '<p class="text-red-400">Failed to load recordings</p>';
    }
  }

  function renderReview(){
    if(recordings.length === 0){
      reviewContainer.innerHTML = '<p class="text-slate-500">No recordings found for review.</p>';
      return;
    }
    const rec = recordings[currentIdx];
    
    // Build the review card
    let html = `
      <div class="card space-y-4">
        <div class="flex items-center justify-between">
          <span class="text-sm text-slate-400">Signal ${currentIdx + 1} of ${recordings.length}</span>
          <div class="flex gap-2">
            <button class="chip text-xs hover:bg-sky-600/40 cursor-pointer" onclick="event.stopPropagation();navigateReview(-1)" ${currentIdx === 0 ? 'disabled style="opacity:0.4"' : ''}>← Prev</button>
            <button class="chip text-xs hover:bg-sky-600/40 cursor-pointer" onclick="event.stopPropagation();navigateReview(1)" ${currentIdx === recordings.length - 1 ? 'disabled style="opacity:0.4"' : ''}>Next →</button>
          </div>
        </div>
        <div class="text-center">
          <div class="text-2xl font-bold font-mono">${rec.f_mhz ? rec.f_mhz.toFixed(4) : '—'} MHz</div>
          <div class="text-xs text-slate-400">${rec.duration_ms ? (rec.duration_ms/1000).toFixed(1)+'s' : ''} ${rec.sample_rate_hz ? '@ '+(rec.sample_rate_hz/1e6).toFixed(1)+' MS/s' : ''}</div>
        </div>
        <div>
          <div class="text-xs text-slate-400 mb-1 flex items-center gap-2">
            <span id="playlabel-review" class="cursor-pointer hover:text-sky-400" onclick="togglePlay(${rec.id})">▶ Click waveform to play</span>
            <span id="time-review" class="text-slate-500">0:00 / ${rec.duration_ms ? formatTime(rec.duration_ms/1000) : '--:--'}</span>
            <span id="modlabel-review" class="chip text-xs bg-sky-600/60 text-sky-100" style="display:none">FM</span>
          </div>
          <canvas id="plot-review" height="100" style="width:100%;height:100px;background:#0b1220;border-radius:0.5rem;cursor:pointer"></canvas>
        </div>
        <audio id="audio-review" controls preload="none" style="width:100%;height:36px"></audio>
        <div class="flex flex-wrap gap-2 items-center justify-center">`;
    ['wbfm','fm','am','cw','lsb','usb'].forEach(m => {
      html += `<button class="chip cursor-pointer hover:bg-sky-600/40" onclick="playReviewMod('${m}')">${m.toUpperCase()}</button>`;
    });
    html += `</div>
        <div class="flex flex-wrap gap-3 items-center border-t border-slate-700/40 pt-3">
          <label class="text-xs text-slate-400">Classification:</label>
          <select id="review-classify" class="input text-xs py-1">
            <option value="unknown">Unknown</option>
            <option value="friendly">Friendly</option>
            <option value="ambient">Ambient</option>
            <option value="hostile">Hostile</option>
          </select>
          <label class="text-xs text-slate-400">Label:</label>
          <input id="review-label" class="input text-xs py-1" placeholder="e.g. FM station" style="max-width:180px">
          <button class="btn text-xs" onclick="saveReview()">Save & Next</button>
          <label class="flex items-center gap-1 text-xs text-slate-400">
            <input type="checkbox" id="review-autoadvance" ${autoplay ? 'checked' : ''}> Auto-advance
          </label>
        </div>
        <div id="review-status" class="text-xs text-slate-500 text-center"></div>
      </div>`;

    reviewContainer.innerHTML = html;

    // Load amplitude
    loadReviewAmplitude(rec.id);
  }

  async function loadReviewAmplitude(id){
    const canvas = document.getElementById("plot-review");
    if(!canvas) return;
    try{
      const r = await fetch("/api/recordings/"+id+"/amplitude", { headers: auth({}) });
      if(!r.ok) return;
      const buf = await r.arrayBuffer();
      const floats = new Float32Array(buf);
      const arr = Array.from(floats);
      canvas._amplitudeData = arr;
      canvas._amplitudeId = id;
      drawAmplitude(canvas, arr, 0);
    }catch(e){}
  }

  function navigateReview(dir){
    const newIdx = currentIdx + dir;
    if(newIdx < 0 || newIdx >= recordings.length) return;
    currentIdx = newIdx;
    renderReview();
  }

  function playReviewMod(mod){
    const id = recordings[currentIdx]?.id;
    if(!id) return;
    playModulation(id, mod);
  }

  async function saveReview(){
    const rec = recordings[currentIdx];
    if(!rec) return;
    const status = document.getElementById("review-status");
    try{
      const cls = document.getElementById("review-classify")?.value || "unknown";
      const label = document.getElementById("review-label")?.value || "";
      // Save classification via PATCH /api/signals/<detection_id>
      if(rec.detection_id){
        await fetch("/api/signals/"+rec.detection_id, {
          method: "PATCH",
          headers: {'Content-Type':'application/json', ...(TOKEN ? {"Authorization":"Bearer "+TOKEN} : {})},
          body: JSON.stringify({classification: cls, label: label})
        });
      }
      if(document.getElementById("review-autoadvance")?.checked){
        navigateReview(1);
      }
      status.textContent = "✅ Saved. " + (rec.detection_id ? "Signal #" + rec.detection_id : "") + " → " + cls;
    }catch(e){
      status.textContent = "❌ Save failed";
    }
  }

  loadReview();

  // Expose for onclick handlers
  window.navigateReview = navigateReview;
  window.playReviewMod = playReviewMod;
  window.saveReview = saveReview;
})();
</script>
{% endblock %}
